version: "1.0"

# Core auto-detection checks (run first)
autoDetectChecks:
  - id: studio_running
    description: "Check if Roblox Studio is running and MCP-accessible"
    command: "python3 {plugin_root}/scripts/bridge-check.py --studio"
    successPattern: '"studio": "ok"'
    timeout: 5
    
  - id: bridge_health
    description: "Check bridge service health"
    command: "python3 {plugin_root}/scripts/bridge-check.py"
    successPattern: '"bridge": "up"'
    timeout: 5
    
  - id: cloud_blender
    description: "Check cloud Blender availability"
    command: "bash {plugin_root}/skills/blender-assets/reference/cloud_blender.sh version"
    successPattern: "Blender.*[0-9]+\\.[0-9]+"
    timeout: 10
    
  - id: figma_connector
    description: "Check Figma connector authentication"
    command: "figma_mcp"
    mcp_call:
      tool: "whoami"
      args: {}
    successPattern: ".*"  # Any response means authenticated
    optional: true
    
  - id: open_cloud_key
    description: "Check Open Cloud API key presence"
    env_var: "ROBLOX_OPEN_CLOUD_API_KEY"
    
  - id: bridge_key
    description: "Check bridge key presence"
    env_var: "GROK_STUDIO_BRIDGE_KEY"

# Manual step templates (shown only when needed)
manualSteps:
  - id: install_studio
    what: "Install and open Roblox Studio"
    why: "Required for building games"
    location: "Download from https://www.roblox.com/create"
    verifyCheck: studio_running
    
  - id: enable_team_create
    what: "Enable Team Create on your place"
    why: "Saves every edit to Roblox so nothing is lost"
    location: "Studio: Home > Collaborate, or File > Team Create"
    verifyCheck: place_has_team_create
    
  - id: enable_studio_mcp
    what: "Enable Studio as MCP server"
    why: "Lets the team edit your place"
    location: "Studio: Assistant > ... > Manage MCP Servers > Enable Studio as MCP server"
    verifyCheck: studio_running
    
  - id: enable_http_requests
    what: "Enable Allow HTTP Requests (if DataStores used)"
    why: "Required for DataStore testing in Studio"
    location: "Game Settings > Security > Allow HTTP Requests"
    optional: true
    
  - id: create_open_cloud_key
    what: "Create Roblox Open Cloud API key"
    why: "Enables automatic model uploads (otherwise one Import 3D click per batch)"
    location: |
      1. Go to https://create.roblox.com/dashboard/credentials
      2. Click "Create API key"
      3. Add the Assets API with read and write (asset:read, asset:write)
      4. Set "Accepted IP addresses" to 0.0.0.0/0 (cloud IP isn't fixed)
      5. Set an expiry if you like
      6. Copy the key and paste into the secret prompt
    secretPrompt: "ROBLOX_OPEN_CLOUD_API_KEY"
    verifyCommand: "python3 {plugin_root}/scripts/opencloud_upload.py introspect"
    optional: true
    
  - id: setup_ngrok
    what: "Create ngrok account and get authtoken + static domain"
    why: "Exposes Studio to cloud Bots with a stable URL"
    location: |
      1. Sign up at https://dashboard.ngrok.com/signup
      2. Get authtoken: https://dashboard.ngrok.com/get-started/your-authtoken
      3. Get free static domain: https://dashboard.ngrok.com/domains (looks like xxx.ngrok-free.dev)
    secretPrompt: "NGROK_AUTHTOKEN"
    textPrompt: "ngrok static domain"
    condition: "bridge_health == 'down' and not ngrok_configured"
    
  - id: install_bridge
    what: "Install bridge service on your PC"
    why: "Background service that survives restarts, uses stable key and URL"
    action: "run_connect_studio_install"
    verifyCheck: bridge_health

# Capability questions (merged with role manifest setupQuestions)
capabilityQuestions:
  - id: figma_seat_type
    type: choice
    prompt: "Do you have a Figma Professional/Organization/Enterprise plan with a Full seat?"
    options:
      - value: yes
        label: "Yes (I have a paid plan and Full seat)"
      - value: no
        label: "No (free plan or View/Collab seat)"
      - value: not_sure
        label: "Not sure"
    default: not_sure
    role: designer
    mapsToCapability: ui_design_path
    
  - id: blender_location
    type: choice
    prompt: "Blender location"
    options:
      - value: cloud
        label: "Cloud Blender (headless, always available)"
    default: cloud
    role: builder
    hidden: true  # Only one option, auto-select
    
  - id: x_posting_route
    type: choice
    prompt: "X (Twitter) posting for Marketing (after game ships)"
    options:
      - value: scheduling_connector
        label: "Link a scheduling service (Buffer, Postiz, BulkPublish)"
      - value: x_api
        label: "X API ($0.015/post, $0.20 with link)"
      - value: drafts_only
        label: "Drafts-only (I'll post manually)"
    default: drafts_only
    role: marketing
    mapsToCapability: x_posting
    
  - id: animation_planning
    type: choice
    prompt: "Animation planning preference"
    options:
      - value: decide_for_me
        label: "Decide for me (plan a rich animation set)"
      - value: i_will_specify
        label: "I'll specify animations I want"
    default: decide_for_me
    role: animator

# Gated approval collection (up front)
approvalQuestions:
  - id: upload_models
    prompt: "Should I upload models to your Roblox account as they're ready?"
    type: yes_no
    default: yes
    mapsTo: "build.approvals.uploadModels"
    
  - id: publish_animations
    prompt: "Should I publish animations as they're ready?"
    type: yes_no
    default: yes
    mapsTo: "build.approvals.publishAnimations"

# Readiness gate (run after setup)
readinessGate:
  - id: G1_connectivity
    description: "Every bot reaches Studio and Blender"
    required: true
    
  - id: G2_model_roundtrip
    description: "Blender -> Studio model round trip"
    required: false  # Skipped without Open Cloud key
    condition: "open_cloud_key == 'present'"
    
  - id: G3_ui_check
    description: "UI builds and passes verification"
    required: false  # Skipped if nothing changed
    
  - id: G4_luau_playtest
    description: "5-second Luau play test, clean console"
    required: false
    
  - id: G5_screen_capture
    description: "Screen capture"
    required: true
