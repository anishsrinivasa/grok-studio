[project]
name = "grok-studio"
version = "0.1.0"
description = "Bridge that turns Roblox Studio's local stdio MCP server into a public HTTPS endpoint for Grok"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
